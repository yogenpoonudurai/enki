name: cloud-build

# Deferred hosted surface: build manually, never publish from this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - name: Build enki-cloud
        run: CGO_ENABLED=0 go build -trimpath -o enki-cloud ./cmd/enki-cloud

      - name: Upload enki-cloud artifact
        uses: actions/upload-artifact@v7
        with:
          name: enki-cloud
          path: enki-cloud
