name: realworld-benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true

      - name: Run development benchmark
        run: make bench-real-world-update

      - name: Run held-out live-OSV benchmark
        run: make bench-heldout-update

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: realworld-benchmark
          path: |
            docs/benchmark-real-world.md
            docs/benchmark-heldout.md
            internal/bench/testdata/realworld-baseline.json
            internal/bench/testdata/heldout-baseline.json
