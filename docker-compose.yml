services:
  enki-cloud:
    build: .
    ports:
      - "8080:8080"
    environment:
      ENKI_CLOUD_ADMIN_KEY: ${ENKI_CLOUD_ADMIN_KEY:?set ENKI_CLOUD_ADMIN_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ENKI_AI_MODEL: ${ENKI_AI_MODEL:-deepseek-flash}
      ENKI_AI_BASE_URL: ${ENKI_AI_BASE_URL:-}
      ENKI_AI_KEY: ${ENKI_AI_KEY:-}
      ENKI_STRIPE_WEBHOOK_SECRET: ${ENKI_STRIPE_WEBHOOK_SECRET:-}
      ENKI_STRIPE_SECRET_KEY: ${ENKI_STRIPE_SECRET_KEY:-}
      ENKI_STRIPE_PRICE_PRO: ${ENKI_STRIPE_PRICE_PRO:-}
      ENKI_STRIPE_PRICE_TEAM: ${ENKI_STRIPE_PRICE_TEAM:-}
      ENKI_STRIPE_SUCCESS_URL: ${ENKI_STRIPE_SUCCESS_URL:-https://example.com/billing/success}
      ENKI_STRIPE_CANCEL_URL: ${ENKI_STRIPE_CANCEL_URL:-https://example.com/billing/cancel}
      ENKI_RETENTION_HOURS: ${ENKI_RETENTION_HOURS:-24}
    restart: unless-stopped
