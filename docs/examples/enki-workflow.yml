# Copy to .github/workflows/enki.yml and replace <owner>.
name: enki

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Offline-fast gate: MCP configs, agent permissions, secrets.
      - uses: <owner>/enki@v0.4.0
        with:
          args: "--fail-on high --deps ai --modules mcp,secrets,agent-permissions"

      # Optional: upload SARIF to code scanning (public repos / GHAS).
      # - uses: github/codeql-action/upload-sarif@v3
      #   if: always()
      #   with:
      #     sarif_file: enki.sarif
